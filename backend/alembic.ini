# Alembic configuration for glados-backend.
#
# sqlalchemy.url is overridden at runtime by alembic/env.py from
# Settings (DATABASE__URL), the placeholder below is never used.

[alembic]
# path to migration scripts, relative to this file
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepended to sys.path: the working directory, so that env.py imports `src`.
prepend_sys_path = .

path_separator = newline

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
