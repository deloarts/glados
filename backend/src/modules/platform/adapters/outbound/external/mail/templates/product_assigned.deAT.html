<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Du wurdest einem Produkt zugewiesen</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f4; font-family: Arial, sans-serif; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: #1a1a2e; padding: 32px 40px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; letter-spacing: .5px; }
    .body { padding: 32px 40px; color: #333333; line-height: 1.6; }
    .body p { margin: 0 0 16px; }
    .cta { display: inline-block; margin: 8px 0 4px; padding: 12px 28px; background: #1a1a2e; color: #ffffff !important; text-decoration: none; border-radius: 4px; font-weight: bold; }
    .footer { background: #f4f4f4; padding: 16px 40px; font-size: 12px; color: #999; text-align: center; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>Produkt zugewiesen</h1>
    </div>
    <div class="body">
      <p>Hallo {{ full_name }},</p>
      <p>Du wurdest als verantwortliche Person für das Produkt <strong>{{ product_number }}</strong> festgelegt.</p>
      <p>
        <a class="cta" href="{{ domain }}">Glados öffnen</a>
      </p>
    </div>
    <div class="footer">
      Diese Nachricht wurde automatisch generiert. Bitte antworte nicht darauf.
    </div>
  </div>
</body>
</html>
