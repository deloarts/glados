<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Glados account has been deactivated</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f4; font-family: Arial, sans-serif; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: #1a1a2e; padding: 32px 40px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; letter-spacing: .5px; }
    .body { padding: 32px 40px; color: #333333; line-height: 1.6; }
    .body p { margin: 0 0 16px; }
    .footer { background: #f4f4f4; padding: 16px 40px; font-size: 12px; color: #999; text-align: center; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>Account Deactivated</h1>
    </div>
    <div class="body">
      <p>Hi {{ full_name }},</p>
      <p>Your Glados account has been deactivated. You will no longer be able to sign in.</p>
      <p>If you believe this is a mistake, please contact your administrator or visit {{ domain }} for more information.</p>
    </div>
    <div class="footer">
      This message was generated automatically. Please do not reply.
    </div>
  </div>
</body>
</html>
