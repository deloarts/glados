# TLS always terminates outside this container, so $scheme here is plain
# http even when the client connected over https. Preserve the
# X-Forwarded-Proto a TLS-terminating proxy in front of us already set;
# blindly sending our own $scheme would make the backend build http://
# redirect URLs (FastAPI's trailing-slash 307), which the browser then
# blocks as a cross-origin downgrade. Allowlist form on purpose: only the
# value "https" is ever taken from the incoming header, anything else -
# including no proxy at all - falls back to our own $scheme, so this can
# never inject arbitrary header content downstream. A client that claims
# https over plain http only gets https redirects it cannot follow.
map $http_x_forwarded_proto $client_proto {
    https   https;
    default $scheme;
}

# Per-client request rate limit for the API: a safety net against a runaway
# client (a frontend refresh loop, a misbehaving script), not a security
# control; login attempts are throttled by the backend itself. The key is
# the client address the real_ip settings below resolve, so a client cannot
# pick its own bucket with a forged X-Forwarded-For. 50 requests/s with a
# burst of 200 leaves ample room for a dashboard opening several dozen
# requests at once.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_status 429;

# The policy for a stored file a browser opens from /objects/.
# Uploads are user content, so the document a browser makes of one runs in
# a sandbox with a unique origin and may load nothing. An HTML file
# disguised as a drawing can then run no script on the Glados origin,
# whatever content type the object was stored with.
# A PDF is only kept out of frames: browsers refuse to run their built-in
# PDF viewer in a sandboxed document, and a PDF served as application/pdf
# with nosniff runs nothing on this origin.
map $upstream_http_content_type $stored_object_csp {
    ~*^application/pdf  "frame-ancestors 'none'";
    default             "sandbox; default-src 'none'; frame-ancestors 'none'";
}

# The backend gets a new IP whenever its container is recreated (a deploy,
# an image update, a compose profile change), usually while this
# container keeps running. A hostname written directly in proxy_pass is
# resolved once at startup, so nginx would keep dialling the dead address
# and answer every API call with 502. The resolve parameter makes nginx
# re-resolve the name through Docker's embedded DNS instead; it needs the
# shared memory zone to hold the changing address.
upstream backend_app {
    zone backend_app 64k;
    resolver 127.0.0.11 valid=10s;
    server backend:3000 resolve;
}

server {
    listen 80;

    # The client address. A connection from a trusted proxy (the reverse
    # proxy on the host, the cloudflared tunnel) carries the client in
    # X-Forwarded-For; the included file lists those proxies and is written
    # at start from GLADOS_TRUSTED_PROXIES (trusted-proxies.sh). nginx walks
    # the header from the right and takes the first address that is not a
    # trusted proxy, so entries a client prepends are never used. Any other
    # connection is the client itself, whatever headers it sends. The
    # result is $remote_addr, which the rate limit keys on and which
    # replaces X-Forwarded-For towards the backend.
    include            /etc/nginx/glados/trusted-proxies.conf;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    # Hides the nginx version number from the Server response header and
    # from default error pages, one less detail an attacker gets for free.
    server_tokens off;

    # Static assets are gzipped; API responses generally aren't worth it
    # (JSON is already small per-request) and the SSE stream below turns
    # this off explicitly - buffering/compressing a long-lived stream would
    # defeat the point of it. font/woff2 is already compressed, so it's
    # left out of gzip_types (re-compressing it wastes CPU for no gain).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html is the one response these actually protect (CSP and
        # X-Frame-Options are document-level; they're meaningless on the
        # hashed /assets/ files below, which is why that location doesn't
        # repeat them). `add_header` replaces rather than merges with a
        # parent's list the moment a location defines its own, so every
        # header this route needs lives here rather than at server level.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Only meaningful once served over HTTPS - browsers ignore this
        # header entirely over plain HTTP, so it's safe to send unconditionally
        # from an image that may also run behind a plain-HTTP dev/staging setup.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # camera=(self): the QR-scan feature (ScanDialog.vue) needs it. Every
        # other sensor/feature this app has no use for is denied outright.
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), camera=(self)" always;
        # The enforced page policy. Every source beyond 'self' is there for
        # one feature:
        #   style-src 'unsafe-inline': OpenVue's runtime theming injects
        #     <style> tags, and the sanitised mail and message HTML keeps
        #     style attributes.
        #   img-src data: blob:: QR codes and report images are data URLs;
        #     previews, thumbnails, avatars and mesh textures are object URLs
        #     of files fetched through the API.
        #   connect-src http://localhost:8600: the glados-terminal bridge on
        #     a terminal device (core/terminal/bridgeClient.ts).
        #   worker-src blob:: the QR scanner and the confetti both start their
        #     worker from an object URL.
        #   frame-src blob:: PDF previews show an object URL in an iframe.
        #   object-src blob:: the browser's PDF viewer inside such a preview
        #     is an embedded plugin, and the preview document inherits this
        #     policy.
        # No script source beyond 'self': nothing the bundle runs needs eval.
        # vuedraggable's bundled global lookup tries Function("return this")
        # inside a try and falls back to window, so the queue page reports one
        # blocked eval that changes nothing.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://localhost:8600; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self'; object-src blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Hashed filenames (content-addressed by Vite) never change contents
    # under the same name, so these can be cached for a year - unlike
    # index.html above, which must always be revalidated to pick up a new
    # deploy's asset hashes.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # X-Forwarded-For carries only the resolved client address, never the
    # incoming header, so the backend sees exactly what nginx decided.
    location /api/ {
        proxy_pass         http://backend_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        add_header         X-Content-Type-Options "nosniff" always;
        client_max_body_size 110M;
        limit_req          zone=api burst=200 nodelay;
    }

    # The Excel demand import parses the whole workbook in-request and can
    # outlast the default read timeout. Location blocks do not inherit
    # proxy_set_header or client_max_body_size from the sibling /api/ block,
    # so both are repeated here to keep the import aligned with it.
    location ~ ^/api/v1/web/(bought-items|made-items)-demands/batch/ {
        proxy_pass         http://backend_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        add_header         X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 120s;
        client_max_body_size 110M;
        limit_req          zone=api burst=200 nodelay;
    }

    # Live row-sync SSE stream: must stay unbuffered and long-lived, unlike
    # every other /api/ route. Without this override, the /api/ block's
    # default proxy_buffering and the 60s default proxy_read_timeout would
    # buffer events and drop the connection every minute, causing constant
    # client reconnect storms.
    location /api/v1/web/live {
        proxy_pass         http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        gzip               off;
    }

    # Presigned file URLs are path style, so their first segment is the
    # bucket: the bundled SeaweedFS serves the bucket "objects" under this
    # route. Browsers only ever read through it, so any other method is
    # refused here before it reaches the storage server. It serves user
    # uploads, so it sends nosniff and the stored object policy from the map
    # at the top.
    location /objects/ {
        resolver 127.0.0.11 valid=30s;
        set $seaweedfs http://seaweedfs:8333;
        proxy_pass $seaweedfs;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $stored_object_csp always;
        limit_except GET HEAD {
            deny all;
        }
    }

    location /health {
        proxy_pass  http://backend_app/health;
        access_log  off;
    }

    location = /ready {
        proxy_pass  http://backend_app/ready;
        access_log  off;
    }

    # GET /metrics (backend) is deliberately NOT proxied here: it
    # is scraped by Prometheus on the docker network only, never exposed
    # through this frontend or Traefik.
}
