name: glados

services:

  # ─── Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: docker/backend.Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env.dev
    volumes:
      - ./backend/src:/app/src # hot reload
      - ./backend/alembic:/app/alembic # migration changes reflected live
      - ./.volumes/media:/app/media
      - ./.volumes/logs:/app/logs
      - ./.volumes/pre-migration-dumps:/app/pre-migration-dumps
    ports:
      - "3000:3000" # direct access for debugging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn src.bootstrap.main:app --host 0.0.0.0 --port 3000 --reload
      --timeout-graceful-shutdown 5
    networks:
      - internal
      - external

  # ─── Maintenance sidecar (optional, --profile maintenance) ──
  # Dev counterpart of the prod compose's maintenance service, for parity
  # when testing the recovery procedures locally -- see
  # docs/OPERATIONS.md sections 4.2, 5 and 6. Same build/volumes as dev's
  # backend, just never runs the app: docker/entrypoint.sh's "maintenance"
  # case is `exec sleep infinity`, dispatched before migrations.
  maintenance:
    build:
      context: ./backend
      dockerfile: docker/backend.Dockerfile
      target: dev
    profiles: [maintenance]
    restart: "no"
    env_file: .env.dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./.volumes/media:/app/media
      - ./.volumes/logs:/app/logs
      - ./.volumes/pre-migration-dumps:/app/pre-migration-dumps
    command: maintenance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ─── Postgres ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # Set explicitly so the connection budget is documented: backend workers x
    # (DATABASE__POOL_SIZE + DATABASE__MAX_OVERFLOW) must stay well below it.
    command: ["postgres", "-c", "max_connections=100", "-c", "log_min_duration_statement=500"]
    env_file: .env.dev
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432" # expose for local DB clients (DBeaver, etc.)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  pgadmin:
    image: dpage/pgadmin4@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - internal

  # ─── SeaweedFS ──────────────────────────────────────────────
  # S3 gateway on :8333 for the seaweedfs storage provider, admin UI on
  # :23646 with the S3 key pair as login. Only the bucket objects exists, as
  # in the release compose file.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command: >
      mini -dir=/data -bucket=objects -s3.autoCreateBucket=false
      -admin.user=${SEAWEEDFS_ACCESS_KEY:-} -admin.password=${SEAWEEDFS_SECRET_KEY:-}
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-}
    volumes:
      - ./.volumes/seaweedfs:/data
    ports:
      - "8333:8333"    # S3 API
      - "23646:23646"  # admin UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
      - external

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: redis-server --appendonly yes # persistence across restarts
    volumes:
      - ./.volumes/redis:/data
    ports:
      - "6379:6379" # expose for local inspection (redis-cli)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - external

networks:
  internal:
    # backend ↔ postgres, redis (not exposed)
    driver: bridge
  external:
    # backend ↔ frontend (no direct DB access)
    driver: bridge

